# Builds Windows/macOS/Linux binaries on tag push (v*) and attaches them
# to a GitHub Release. Free unlimited minutes on public repos.
#
# To cut a release:
#   1. Bump `currentVersion` in main.go (e.g. "0.3.0")
#   2. git commit -am "release v0.3.0"
#   3. git tag v0.3.0
#   4. git push origin main --tags
#   → This workflow builds + uploads release artifacts automatically.
#
# Users' uploaders auto-detect the new version on next launch and self-update.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write  # needed to create release + upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go mod tidy
          mkdir -p dist
          OUT="dist/voidscout-uploader-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -ldflags "-s -w" -o "$OUT" .
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: voidscout-uploader-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/voidscout-uploader-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lhR dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/voidscout-uploader-*
          generate_release_notes: true
          fail_on_unmatched_files: true
