# Builds Windows/macOS/Linux binaries on tag push (v*) and attaches them
# to a GitHub Release. Free unlimited minutes on public repos.
#
# To cut a release:
#   1. Bump `currentVersion` in main.go (e.g. "0.3.0")
#   2. git commit -am "release v0.3.0"
#   3. git tag v0.3.0
#   4. git push origin main --tags
#   → This workflow builds + uploads release artifacts automatically.
#
# Users' uploaders auto-detect the new version on next launch and self-update.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Least privilege: building needs only read access. The release job grants
# itself write access to publish. This repo's releases are what every
# installed uploader auto-updates from, so the build job gets no write token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          # Dependencies come from the committed go.mod/go.sum. No "go mod
          # tidy" here: resolving versions at build time would let a release
          # ship dependencies nobody reviewed.
          mkdir -p dist
          OUT="dist/voidscout-uploader-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -ldflags "-s -w" -o "$OUT" .
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v7
        with:
          name: voidscout-uploader-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/voidscout-uploader-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lhR dist/

      # GitHub's own CLI rather than a third-party action: this step holds a
      # write token and publishes the binaries every uploader installs.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s failglob
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            dist/voidscout-uploader-*
